spring:
  application:
    name: meucampus-turmas

# ConexÃ£o com o PostgreSQL no Docker
  datasource:
    url: jdbc:postgresql://localhost:5432/meucampus_turmas
    username: postgres
    password: postgres

# ConfiguraÃ§Ã£o do JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

# Endereços dos outros serviços do MeuCampus e tempo limite das chamadas (em ms)
servicos:
  cadastro:
    url: http://localhost:8081
  matriculas:
    url: http://localhost:8083
  timeout:
    conexao-ms: 2000
    leitura-ms: 3000